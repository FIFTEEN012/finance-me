<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FinanceMe</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0614;
        color: #f5f3ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        text-align: center;
      }
      .card { max-width: 320px; }
      .icon { font-size: 56px; margin-bottom: 12px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.6; color: #c4b5fd; margin: 0 0 24px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #7c3aed;
        box-shadow: 0 4px 0 #5b21b6;
      }
      button:active { transform: translateY(2px); box-shadow: 0 2px 0 #5b21b6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>FinanceMe ต้องใช้อินเทอร์เน็ตเพื่อซิงก์ข้อมูลกับเว็บ ตรวจสอบ Wi‑Fi หรือข้อมูลมือถือ แล้วลองอีกครั้ง</p>
      <button type="button" onclick="retry()">ลองอีกครั้ง</button>
    </div>
    <script>
      // Set by `cap sync` from capacitor.config.ts (server.url).
      function retry() {
        var cfg = (window.Capacitor && window.Capacitor.config) || {};
        var url = (cfg.server && cfg.server.url) || 'https://finance-app-red-one.vercel.app';
        window.location.href = url;
      }
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
