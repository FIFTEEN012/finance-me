services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: finance-app-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_local
      POSTGRES_USER: finance_local
      POSTGRES_PASSWORD: finance_local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_local -d finance_local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - finance_postgres_local_data:/var/lib/postgresql/data

volumes:
  finance_postgres_local_data:
    name: finance-app-postgres-local-data
